name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The same gofmt/vet/test gate as CI — one definition, so the release
  # can't tag-and-ship a commit CI would have rejected.
  check:
    uses: ./.github/workflows/ci.yml
  goreleaser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (version noted alongside) — this workflow holds a
      # contents: write token, so mutable @vN tags are the wrong reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog from git history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty until the tap exists — see docs/RELEASING.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # goreleaser skips the cask push when that token is absent and exits
      # 0, so the release reports success while `brew install --cask
      # pjlsergeant/tap/byre` — the one install command the README and the
      # install page bless (PLACEMENT P3) — still serves the previous
      # version. The skip stays non-fatal (ADR 0016: a release must not
      # block on brew); this is what stops it being silent.
      - name: Warn when the Homebrew cask was not published
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then exit 0; fi
          msg="HOMEBREW_TAP_GITHUB_TOKEN is unset: the Homebrew cask was built into dist/ but NOT pushed to pjlsergeant/homebrew-tap. 'brew install --cask pjlsergeant/tap/byre' still installs the PREVIOUS version. See docs/RELEASING.md."
          echo "::warning title=Homebrew cask not published::$msg"
          { echo "> [!WARNING]"; echo "> $msg"; } >> "$GITHUB_STEP_SUMMARY"
