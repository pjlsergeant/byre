name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs this same gate before publishing

permissions:
  contents: read

jobs:
  test:
    # Two toolchains: go.mod is the declared minimum; stable is the
    # forward-compat leg — `go install .../byre@latest` builds with the
    # user's CURRENT toolchain, so a break under new Go must not wait for
    # a user to report it. gofmt and vet run on the go.mod leg only: their
    # findings drift across Go releases, so on the stable leg they could
    # turn CI red on a Go release day with no commit at fault — and users
    # never run either, so they prove nothing about forward compatibility.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (version noted alongside): tags like
      # @v4 are mutable references, and release.yml runs with contents: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly one of these is set per matrix leg; setup-go ignores
          # the empty one.
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - name: gofmt
        if: ${{ matrix.go-version-file }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        if: ${{ matrix.go-version-file }}
        run: go vet ./...
      # byre SHIPS ~2,100 lines of shell -- the launcher, the profile shim,
      # every skill's hooks -- into images users run, and nothing parsed it.
      # A syntax error there surfaces as a broken box, not a failed build.
      # `bash -n` is the floor (parse only, no execution, no lint opinions);
      # anything stronger is a separate decision.
      - name: shell syntax
        if: ${{ matrix.go-version-file }}
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "bash -n failed: $f" >&2; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
      # tmux: the TUI test tier (internal/tuitest) drives the built byre
      # binary in a private tmux server. The gate set without tmux FAILS
      # (tuitest.Require) — an install regression must not silently skip
      # the tier. (The BYRE_DEMO_REC recording tier is parked — see TODO.md;
      # its toolchain installs come back here when it revives.)
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: go test
        run: BYRE_TUI_TESTS=1 go test -race ./...

  # The engine-free tiers (unit suite + tmux TUI tier) on macOS — the OS
  # most byre hosts actually run, previously covered only by daily use.
  # GitHub's macOS runners can't run Docker, so the engine suite stays on
  # the ubuntu integration job; the clipboard-shim TUI tests fake the
  # LINUX read backend (wl-paste) and skip on darwin, keeping DELIVER.md's
  # macOS-verified pasteboard posture. gofmt/vet are platform-independent
  # and already run above.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: brew install tmux
      - name: go test
        run: BYRE_TUI_TESTS=1 go test -race ./...

  # Known-vulnerability scan. The tool version is pinned; the vulnerability
  # database it consults is fetched live. Its own job on the stable
  # toolchain: govulncheck's go floor moves faster than byre's go.mod
  # (v1.6.0 wants go >= 1.25), and it analyzes source, so it doesn't need
  # to run on the toolchain that builds byre.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # The gated engine suite (BYRE_DOCKER_TESTS=1) against the runner's real
  # engines. A separate job so the fast unit signal stays fast; release.yml's
  # workflow_call pulls this in too, so a release can't ship without it.
  # Interactive iteration on these tests happens on the sacrificial inttest
  # VM (docs/BYRE-DEVELOPMENT.md); CI is the authoritative gate.
  #
  # BOTH engines, because byre supports both and only one of them was ever
  # gated: podman differs where it matters most (rootless --userns=keep-id id
  # mapping, ADR 0008) and a break there was previously found only by someone
  # running BYRE_TEST_ENGINE=podman by hand. fail-fast is off so a podman
  # failure still leaves the docker verdict readable.
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: docker
            timeout: 20m
          # Podman is several times slower than docker for the same suite, so
          # it gets its own budget rather than the docker leg's.
          - engine: podman
            timeout: 45m
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # uidmap provides newuidmap/newgidmap, which rootless podman needs to
      # map the invoking user into the box.
      - name: install tmux and the engine
        run: sudo apt-get update && sudo apt-get install -y tmux podman uidmap
      - name: engine version
        run: ${{ matrix.engine }} --version
      # BYRE_SSH_LOOP_TESTS stays unset here: the runner has no sshd, and
      # those tests edit ~/.ssh — they ride the sacrificial inttest VM.
      # BYRE_TEST_ENGINE is explicit on both legs: auto-detect prefers docker,
      # so without it the podman leg would silently re-run the docker one.
      - name: gated integration tests (${{ matrix.engine }})
        run: BYRE_DOCKER_TESTS=1 BYRE_TUI_TESTS=1 BYRE_TEST_ENGINE=${{ matrix.engine }} go test ./... -run Integration -v -timeout ${{ matrix.timeout }}
