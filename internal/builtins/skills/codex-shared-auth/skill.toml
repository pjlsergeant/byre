# Built-in companion skill: codex-shared-auth (ADR 0017).
#
# One Codex login shared by every byre box that opts in. Enabled ALONGSIDE
# the codex skill (skills = ["codex-shared-auth"] — per box via the onboarding
# offer's yes in the project's byre.config, or machine-wide by hand in
# ~/.byre/default.config). Mechanism:
# $CODEX_HOME/auth.json normally becomes a symlink into the machine-scoped
# identity volume. Refresh writes are in-place and therefore follow it. OAuth
# LOGIN is different as of Codex 0.146: login first revokes and removes the
# existing auth path, so a successful login lands as a fresh regular local
# file. A short locked reconciler validates both candidates, chooses the newer
# credential (`last_refresh`, then mtime), atomically publishes it to the
# identity volume, and restores the symlink. Evidence:
# docs/AGENT-CREDENTIAL-MECHANICS.md. (Claude gets a token-env mechanism
# instead — its refresh rotation makes file sharing unsafe; see
# claude-shared-auth.)
#
# The firstrun hook reconciles and re-asserts the symlink EVERY launch. The
# codex skill's own device-login hook also reconciles immediately after a
# successful login, so other boxes see the replacement without waiting for a
# restart. A bare mid-session `codex login` remains local until this box's next
# launch; that is the accepted residual without wrapping or patching Codex.
#
# Accepted residual (recorded in the design, do not re-raise): Codex's
# cross-process refresh has no lock — two boxes refreshing in the same window
# race benignly (last-writer-wins on a still-valid token).
#
# Logout (and the clear-before-login phase) revokes the refresh token
# server-side before unlinking. That intentionally affects every box sharing
# the login. A successful replacement login becomes the machine credential at
# the next reconciliation; Byre never deletes shared auth merely because one
# box's local link is absent, since absence alone does not prove revocation.

description = "Share one Codex login across all your projects."

# Offerable at onboarding: when codex is picked as the agent, the first-run
# picker offers to opt that box into the shared credentials (ADR 0025).
# Declaring the key vouches the mechanism is ready (verified live, ADR 0017).
shared_auth_for = "codex"

[build]
apt = ["jq", "util-linux"]
files = { "firstrun.sh" = "/etc/byre/firstrun.d/00-codex-shared-auth", "reconcile.sh" = "/usr/local/lib/byre-codex-auth-reconcile" }

[[volumes]]
name = "codex-identity"
role = "state"
target = "/home/dev/.byre-identity/codex"
scope = "machine"
